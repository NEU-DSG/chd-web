<h1 style="text-align: center;">Organizations</h1>
<div id="map"></div>

<script>
	const map = L.map('map').setView([42.35, -71.08], 11);

	const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);

	const organizations = ;

	// Store markers by ID
	const markers = {};

	organizations.forEach(loc => {
		const coordStr = loc.coordinate_location?.value;
		if (!coordStr) return;
		const [lat, lng] = coordStr.split(",").map(Number);
		// grab id for each org
		const id = loc.organization.value.split("/").pop();
		const marker = L.marker([lat, lng])
			.addTo(map)
			.bindPopup(`<strong><a href="/en/organizations/${ loc.organization.value.split('/').pop() }">${loc.organizationLabel.value}</a></strong>`);
		// add id to markers dict
		markers[id] = { marker, lat, lng };
	});

	const params = new URLSearchParams(window.location.search);
	const targetOrg = params.get("org");
	// if both exist, retrieve the marker from the dict and display
	if (targetOrg && markers[targetOrg]) {
		const { marker, lat, lng } = markers[targetOrg];
		map.setView([lat, lng], 16);
		marker.openPopup();
	}
</script>

<script>
// immediately initialize
(() => {
  // Keep any query string on every language link — header dropdown AND footer
  const query = window.location.search;

  if (query) {
    document.querySelectorAll("a.lang-switch").forEach(link => {
      const url = new URL(link.href, window.location.origin);
      url.search = query;
      link.href = url.toString();
    });
  }

  // Header language dropdown
  // check if dropdown exists
  const dropdown = document.querySelector(".lang-dropdown");
  if (!dropdown) return;

  // grab items
  const button = dropdown.querySelector(".lang-dropdown__button");
  const menu = dropdown.querySelector(".lang-dropdown__menu");

  // function for opening and closing menu
  function setOpen(open) {
  menu.hidden = !open;
  button.setAttribute("aria-expanded", open);
  }

  // listen for click
  button.addEventListener("click", event => {
    event.stopPropagation();
    setOpen(menu.hidden);
  });

  // listen for click away
  document.addEventListener("click", event => {
    if (!dropdown.contains(event.target)) {
      setOpen(false);
    }
  });

  // listen for keydown
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      setOpen(false);
    }
  });
})();
</script>
