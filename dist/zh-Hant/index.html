      <h1>華埠歷史目錄</h1>
      <h3>波士頓華埠資源索引</h3>
<p>波士頓華埠是許多面向社區的文化與行動者組織所在地。與許多社區長期居民一樣，這些組織擁有大量的歷史照片、時事通訊、傳單、訪談錄音、地圖、會議紀錄等。此外，許多當地的圖書館、檔案館與博物館也收藏了與華埠歷史相關的館藏。本網站與華埠社區合作夥伴共同合作，旨在記錄來自各種來源的檔案館藏。</p>
<p>本目錄旨在作為社區研究的起點，展示這些館藏的索引，以及與其相關的個人與組織。</p>
